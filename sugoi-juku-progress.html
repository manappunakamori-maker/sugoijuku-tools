<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>参考書 進捗管理</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',sans-serif;background:#f5f4f0;color:#1a1a1a;padding:12px 14px}
.tabs{display:flex;border-bottom:1px solid #ddd;margin-bottom:12px}
.tab{font-size:13px;padding:7px 14px;cursor:pointer;border-bottom:2px solid transparent;color:#888;background:none;border-top:none;border-left:none;border-right:none;font-family:inherit}
.tab.active{color:#1a1a1a;border-bottom:2px solid #1a1a1a;font-weight:600}
.pane{display:none}.pane.active{display:block}

/* header */
.phdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap}
.phdr h2{font-size:13px;font-weight:600;color:#1a1a1a}
.hdr-controls{display:flex;gap:5px;align-items:center;flex-wrap:wrap}
.page-nav{display:flex;align-items:center;gap:4px}
.page-nav button,button.action{font-size:11px;padding:4px 9px;border:1px solid #ccc;border-radius:6px;background:#fff;cursor:pointer;font-family:inherit;white-space:nowrap}
.page-nav button:hover,button.action:hover{background:#f0eeea}
.page-nav button:disabled{opacity:.35;cursor:default}
.page-label{font-size:11px;color:#888;min-width:40px;text-align:center}

/* grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}

/* card */
.card{background:#fff;border:1px solid #e8e6e0;border-radius:11px;overflow:hidden}

/* card-top — always visible */
.card-top{padding:9px 11px 8px;cursor:default}
.card-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;gap:4px}
.card-left{display:flex;align-items:center;gap:6px;min-width:0}
.card-num{font-size:8px;color:#bbb;font-weight:600;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap}
.stat-name{font-size:11px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:130px;color:#1a1a1a}
.card-right{display:flex;align-items:center;gap:5px;flex-shrink:0}
.badge{font-size:8px;padding:2px 5px;border-radius:5px;font-weight:600;white-space:nowrap}
.ahead{background:#EAF3DE;color:#3B6D11}.behind{background:#FAECE7;color:#993C1D}.on-track{background:#E6F1FB;color:#185FA5}.empty{background:#f0f0ef;color:#999}
.edit-btn{width:22px;height:22px;border-radius:5px;border:1px solid #e0ddd5;background:#faf9f6;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;color:#888;transition:background .15s}
.edit-btn:hover{background:#f0eeea;color:#1a1a1a}
.edit-btn.open{background:#1a1a1a;color:#fff;border-color:#1a1a1a}

/* gap bar */
.gap-bar-wrap{margin-bottom:6px}
.gap-label{font-size:8px;color:#aaa;margin-bottom:2px;display:flex;justify-content:space-between}
.gap-label .diff-label{font-weight:600}
.gap-track{height:5px;background:#ede9e0;border-radius:3px;overflow:hidden}
.gap-fill{height:100%;border-radius:3px;transition:width .3s}

/* chart */
.chart-wrap{position:relative;height:100px}
.legend{display:flex;gap:8px;margin-top:3px;padding-bottom:2px}
.legend span{font-size:8px;color:#aaa;display:flex;align-items:center;gap:2px}
.lsq{display:inline-block;width:7px;height:7px;border-radius:1px}
.lline{display:inline-block;width:14px;height:0;border-top:2px solid #378ADD}

/* card-inputs — collapsible */
.card-inputs{display:none;border-top:1px solid #f0eeea;padding:9px 11px 10px;background:#faf9f6}
.card-inputs.open{display:block}
.inputs-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;margin-bottom:6px}
.ig{display:flex;flex-direction:column;gap:2px}
.ig label{font-size:9px;color:#999;font-weight:500}
.ig input,.ig select{font-size:11px;padding:3px 6px;height:26px;border:1px solid #e0ddd5;border-radius:5px;background:#fff;font-family:inherit;color:#1a1a1a}
.ig input:focus,.ig select:focus{outline:none;border-color:#378ADD}
.end-display{font-size:11px;height:26px;padding:3px 7px;background:#f0eeea;border:1px solid #e0ddd5;border-radius:5px;color:#888;display:flex;align-items:center;gap:5px}
.end-date{font-weight:600;color:#1a1a1a;font-size:11px}
.end-days{font-size:9px;color:#bbb}
.pace-row{grid-column:1/-1;display:flex;align-items:center;gap:6px;margin-top:2px}
.pace-label{font-size:9px;color:#999;white-space:nowrap;font-weight:500}
.pace-btns{display:flex;gap:3px}
.pb{font-size:10px;padding:3px 8px;border-radius:5px;border:1px solid #ddd;background:#fff;cursor:pointer;font-family:inherit;line-height:1.4;color:#888}
.pb:hover{background:#f5f5f5}
.pb.active-slow{background:#FAEEDA;color:#854F0B;border-color:#EF9F27}
.pb.active-normal{background:#E6F1FB;color:#185FA5;border-color:#378ADD}
.pb.active-fast{background:#EAF3DE;color:#3B6D11;border-color:#639922}

/* master */
.master-wrap{display:flex;gap:14px}
.master-left{width:190px;flex-shrink:0}
.master-right{flex:1;min-width:0}
.subj-list{border:1px solid #e0ddd5;border-radius:9px;overflow:hidden;margin-bottom:8px}
.subj-item{padding:7px 10px;font-size:12px;cursor:pointer;color:#666;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ede9e0}
.subj-item:last-child{border-bottom:none}
.subj-item.sel{background:#f0eeea;color:#1a1a1a;font-weight:600}
.subj-item:hover{background:#f5f4f0}
.subj-count{font-size:10px;color:#bbb}
.add-subj{display:flex;gap:5px;margin-bottom:9px}
.add-subj input{flex:1;font-size:12px;height:28px;padding:3px 7px;border:1px solid #ddd;border-radius:5px;font-family:inherit}
.add-subj button,.abf-btn{font-size:11px;padding:0 10px;height:28px;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer;font-family:inherit}
.add-subj button:hover,.abf-btn:hover{background:#f0f0f0}
.book-table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:10px}
.book-table th{font-size:9px;font-weight:600;color:#aaa;text-align:left;padding:4px 8px;border-bottom:1px solid #e8e6e0;text-transform:uppercase;letter-spacing:.04em}
.book-table td{padding:5px 8px;border-bottom:1px solid #ede9e0;color:#1a1a1a}
.book-table tr:last-child td{border-bottom:none}
.del-btn{font-size:9px;padding:2px 6px;color:#bbb;border:1px solid #e0ddd5;border-radius:4px;cursor:pointer;background:none}
.del-btn:hover{color:#993C1D;border-color:#993C1D}
.add-book-form{background:#f7f6f2;border-radius:9px;padding:10px 12px}
.add-book-form h3{font-size:10px;font-weight:600;color:#aaa;margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em}
.form-row{display:flex;gap:7px;flex-wrap:wrap;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:3px}
.fg label{font-size:9px;color:#999;font-weight:500}
.fg input,.fg select{font-size:12px;height:28px;padding:3px 7px;border:1px solid #ddd;border-radius:5px;font-family:inherit}
.fg-name{flex:1;min-width:120px}
.empty-state{text-align:center;padding:24px;color:#bbb;font-size:12px}
.notice{font-size:11px;color:#666;background:#f0eeea;padding:7px 10px;border-radius:7px;margin-bottom:10px}

@media print{
  body{background:#fff;padding:6px}
  .tabs,.hdr-controls{display:none}
  .card-inputs{display:none!important}
  .card{break-inside:avoid}
  .grid{gap:6px}
}
</style>
</head>
<body>

<div class="tabs">
  <button class="tab active" onclick="switchTab('progress')">進捗グラフ</button>
  <button class="tab" onclick="switchTab('master')">マスターデータ編集</button>
</div>

<div class="pane active" id="pane-progress">
  <div class="phdr">
    <h2>参考書 進捗管理</h2>
    <div class="hdr-controls">
      <div class="page-nav">
        <button onclick="changePage(-1)" id="prevBtn">‹</button>
        <span class="page-label" id="pageLabel">1 / 1</span>
        <button onclick="changePage(1)" id="nextBtn">›</button>
        <button class="action" onclick="addPage()">+ ページ追加</button>
      </div>
      <button class="action" onclick="window.print()">印刷 / PDF</button>
    </div>
  </div>
  <div class="grid" id="bookGrid"></div>
</div>

<div class="pane" id="pane-master">
  <div class="notice">マスターには「標準ペース」の期間を登録してください。終了日は開始日とペースから自動計算されます。</div>
  <div class="master-wrap">
    <div class="master-left">
      <div class="add-subj">
        <input type="text" id="newSubjInput" placeholder="科目名" maxlength="20">
        <button onclick="addSubject()">追加</button>
      </div>
      <div class="subj-list" id="subjList"></div>
    </div>
    <div class="master-right" id="bookPanel"><div class="empty-state">左から科目を選んでください</div></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<script>
let MASTER={
  '英語':{'速読英熟語':{total:360,days:60,unit:'p'},'英文法ポラリス 1':{total:180,days:45,unit:'p'},'英文法ポラリス 2':{total:160,days:40,unit:'p'},'関正生の英語長文ポラリス 1':{total:10,days:30,unit:'問'},'関正生の英語長文ポラリス 2':{total:10,days:30,unit:'問'},'システム英単語':{total:2027,days:60,unit:'単語'},'鉄壁':{total:1600,days:90,unit:'単語'},'NextStage':{total:800,days:60,unit:'p'},'Vintage':{total:850,days:60,unit:'p'},'英語長文ハイパートレーニング 1':{total:6,days:18,unit:'題'},'英語長文ハイパートレーニング 2':{total:6,days:21,unit:'題'},'英語長文ハイパートレーニング 3':{total:6,days:21,unit:'題'}},
  '数学':{'青チャート 数学Ⅰ+A':{total:364,days:90,unit:'例題'},'青チャート 数学Ⅱ+B':{total:411,days:120,unit:'例題'},'青チャート 数学Ⅲ':{total:181,days:90,unit:'例題'},'黄チャート 数学Ⅰ+A':{total:338,days:90,unit:'例題'},'黄チャート 数学Ⅱ+B':{total:375,days:100,unit:'例題'},'基礎問題精講 数学Ⅰ+A':{total:101,days:45,unit:'題'},'基礎問題精講 数学Ⅱ+B':{total:167,days:60,unit:'題'},'理系数学の良問プラチカ':{total:149,days:60,unit:'題'},'文系の数学 重要事項完全習得編':{total:132,days:45,unit:'題'}},
  '現代文':{'入試現代文へのアクセス 基本編':{total:12,days:28,unit:'題'},'入試現代文へのアクセス 発展編':{total:12,days:28,unit:'題'},'現代文と格闘する':{total:12,days:40,unit:'題'},'ゼロから覚醒 はじめよう現代文':{total:120,days:30,unit:'p'}},
  '古文':{'望月光 古典文法 上':{total:320,days:30,unit:'p'},'望月光 古典文法 下':{total:320,days:30,unit:'p'},'マドンナ古文単語 230':{total:230,days:30,unit:'単語'},'読んでみて覚える古文単語 315':{total:315,days:40,unit:'単語'},'古文上達 基礎編':{total:32,days:30,unit:'題'},'古文上達 56':{total:56,days:45,unit:'題'}},
  '物理':{'物理のエッセンス 力学・波動':{total:196,days:40,unit:'問'},'物理のエッセンス 電磁気・熱・原子':{total:190,days:40,unit:'問'},'良問の風 物理':{total:122,days:45,unit:'問'},'名問の森 力学・熱・波動Ⅰ':{total:52,days:30,unit:'問'},'物理重要問題集':{total:181,days:60,unit:'問'}},
  '化学':{'基礎問題精講 化学':{total:130,days:45,unit:'題'},'化学重要問題集':{total:300,days:75,unit:'問'},'Do シリーズ 理論化学':{total:200,days:40,unit:'p'},'Do シリーズ 無機化学':{total:160,days:30,unit:'p'},'Do シリーズ 有機化学':{total:180,days:35,unit:'p'}},
  '生物':{'基礎問題精講 生物':{total:130,days:40,unit:'題'},'生物重要問題集':{total:237,days:60,unit:'問'}},
  '日本史':{'日本史 一問一答 完全版':{total:4600,days:90,unit:'問'},'HISTORIA 日本史精選問題集':{total:400,days:60,unit:'問'},'金谷の日本史「なぜ」と「流れ」がわかる本':{total:240,days:30,unit:'p'}},
  '世界史':{'世界史 一問一答 完全版':{total:4600,days:90,unit:'問'},'タテから見る世界史':{total:240,days:30,unit:'p'},'ヨコから見る世界史':{total:220,days:30,unit:'p'},'実力をつける世界史 100題':{total:100,days:50,unit:'題'}},
  '地理':{'村瀬のゼロからわかる地理B 系統地理':{total:330,days:40,unit:'p'},'村瀬のゼロからわかる地理B 地誌':{total:300,days:40,unit:'p'},'地理B 一問一答 完全版':{total:3000,days:60,unit:'問'}},
};

const PACES=[
  {key:'slow',mult:0.5,label:'半速',cls:'active-slow'},
  {key:'normal',mult:1.0,label:'標準',cls:'active-normal'},
  {key:'fast',mult:2.0,label:'倍速',cls:'active-fast'},
];

const today=new Date();today.setHours(0,0,0,0);
const fmt=d=>d.toISOString().slice(0,10);
const addD=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
let selectedSubject=Object.keys(MASTER)[0];

function computeEnd(s){
  const p=PACES.find(x=>x.key===s.pace)||PACES[1];
  const days=Math.round(s.baseDays/p.mult);
  return{date:fmt(addD(new Date(s.start),days)),days};
}

// ---- Tab ----
function switchTab(t){
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',['progress','master'][i]===t));
  document.querySelectorAll('.pane').forEach(p=>p.classList.remove('active'));
  document.getElementById('pane-'+t).classList.add('active');
  if(t==='master') renderMaster();
}

// ---- Master ----
function renderSubjList(){
  document.getElementById('subjList').innerHTML=Object.keys(MASTER).map(s=>`
    <div class="subj-item${s===selectedSubject?' sel':''}" onclick="selectSubject('${s}')">
      <span>${s}</span><span class="subj-count">${Object.keys(MASTER[s]).length}冊</span>
    </div>`).join('');
}
function renderBookPanel(){
  const books=MASTER[selectedSubject]||{};
  const rows=Object.entries(books).map(([name,d])=>`
    <tr>
      <td>${name}</td>
      <td style="text-align:right">${d.total.toLocaleString()}</td>
      <td style="text-align:center">${d.unit}</td>
      <td style="text-align:right">${d.days}日 <span style="font-size:9px;color:#bbb">(半速${d.days*2}日 / 倍速${Math.round(d.days/2)}日)</span></td>
      <td style="text-align:center"><button class="del-btn" onclick="deleteBook('${selectedSubject}','${name.replace(/'/g,"\\'")}')">削除</button></td>
    </tr>`).join('');
  document.getElementById('bookPanel').innerHTML=`
    <div style="font-size:13px;font-weight:600;margin-bottom:8px">「${selectedSubject}」<span style="font-size:11px;font-weight:400;color:#bbb"> ${Object.keys(books).length}冊</span></div>
    ${rows?`<table class="book-table"><thead><tr><th>参考書名</th><th style="text-align:right">総数</th><th style="text-align:center">単位</th><th style="text-align:right">標準期間（ペース別）</th><th></th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="empty-state">まだ登録がありません</div>'}
    <div class="add-book-form"><h3>新しい参考書を追加（標準ペースで登録）</h3>
    <div class="form-row">
      <div class="fg fg-name"><label>参考書名</label><input type="text" id="nb_name" placeholder="例：リードLightノート化学"></div>
      <div class="fg"><label>総数</label><input type="number" id="nb_total" min="1" value="200" style="width:70px"></div>
      <div class="fg"><label>単位</label><select id="nb_unit" style="width:70px"><option>p</option><option>問</option><option>題</option><option>例題</option><option>単語</option><option>章</option></select></div>
      <div class="fg"><label>標準期間(日)</label><input type="number" id="nb_days" min="1" value="60" style="width:70px"></div>
      <div class="fg" style="justify-content:flex-end"><button class="abf-btn" onclick="addBook()" style="height:28px">追加</button></div>
    </div></div>`;
}
function renderMaster(){renderSubjList();renderBookPanel();}
function selectSubject(s){selectedSubject=s;renderSubjList();renderBookPanel();}
function addSubject(){
  const inp=document.getElementById('newSubjInput'),name=inp.value.trim();
  if(!name)return;
  if(MASTER[name]){alert('すでに存在します');return;}
  MASTER[name]={};selectedSubject=name;inp.value='';renderMaster();
}
function addBook(){
  const name=document.getElementById('nb_name').value.trim();
  const total=parseInt(document.getElementById('nb_total').value)||1;
  const unit=document.getElementById('nb_unit').value;
  const days=parseInt(document.getElementById('nb_days').value)||60;
  if(!name){alert('参考書名を入力してください');return;}
  if(MASTER[selectedSubject][name]){alert('同じ名前がすでにあります');return;}
  MASTER[selectedSubject][name]={total,unit,days};renderBookPanel();
}
function deleteBook(subj,name){
  if(!confirm(`「${name}」を削除しますか？`))return;
  delete MASTER[subj][name];renderBookPanel();renderSubjList();
}

// ---- Progress ----
function emptySlot(){return{subject:'',bookName:'',total:200,unit:'p',current:0,start:fmt(today),baseDays:60,pace:'normal'};}
const pages=[Array.from({length:6},emptySlot)];
let currentPage=0;
const chartMap={};

function calcData(s){
  const{date:endStr}=computeEnd(s);
  const st=new Date(s.start),en=new Date(endStr);
  if(isNaN(st)||isNaN(en)||en<=st)return null;
  const totalMs=en-st,totalDays=totalMs/86400000;
  const todayDays=Math.min(totalDays,Math.max(0,(today-st)/86400000));
  const todayFrac=todayDays/totalDays;
  const weeks=Math.min(8,Math.ceil(totalDays/7));
  const labels=[],idealData=[],actualData=[];
  for(let w=1;w<=weeks;w++){
    const frac=Math.min(1,w/weeks);
    const d=new Date(st.getTime()+frac*totalMs);
    labels.push(`${d.getMonth()+1}/${d.getDate()}`);
    idealData.push(Math.round(s.total*frac));
    if(frac<=todayFrac+0.01){
      const af=Math.min(frac,todayFrac);
      actualData.push(todayFrac>0?Math.min(Math.round(s.current*(af/todayFrac)),s.total):0);
    }else{actualData.push(null);}
  }
  const idealNow=Math.round(s.total*todayFrac);
  return{labels,idealData,actualData,diff:s.current-idealNow,pct:Math.round(s.current/s.total*100)};
}
function getStatus(d){
  if(!d||(!d.pct&&d.pct!==0))return{cls:'empty',label:'未入力'};
  if(d.diff>5)return{cls:'ahead',label:`+${d.diff} 先行`};
  if(d.diff<-5)return{cls:'behind',label:`${d.diff} 遅延`};
  return{cls:'on-track',label:'順調'};
}
function mkBarColors(d){
  return(d?d.actualData:[]).map((a,i)=>a===null?'rgba(0,0,0,0)':a>=(d.idealData[i])?'rgba(55,138,221,0.72)':'rgba(216,90,48,0.72)');
}
function mkBarBorders(d){
  return(d?d.actualData:[]).map((a,i)=>a===null?'rgba(0,0,0,0)':a>=(d.idealData[i])?'#378ADD':'#D85A30');
}

function updateCard(pg,idx){
  const s=pages[pg][idx],key=`${pg}_${idx}`;
  const d=calcData(s),st=getStatus(d),ch=chartMap[key];
  if(!ch)return;
  const bc=mkBarColors(d),bb=mkBarBorders(d);
  ch.data.labels=d?d.labels:[];
  ch.data.datasets[0].data=d?d.actualData:[];
  ch.data.datasets[0].backgroundColor=bc;
  ch.data.datasets[0].borderColor=bb;
  ch.data.datasets[1].data=d?d.idealData:[];
  ch.options.scales.y.max=s.total||1;
  ch.update('none');

  const el=id=>document.getElementById(`${id}_${key}`);
  // top area
  if(el('sname'))el('sname').textContent=s.bookName||(s.subject||`参考書 ${idx+1}`);
  if(el('badge')){el('badge').textContent=st.label;el('badge').className=`badge ${st.cls}`;}
  if(el('gfill')&&d){
    el('gfill').style.width=Math.min(100,Math.max(0,d.pct))+'%';
    el('gfill').style.background=d.diff>=0?'#378ADD':'#D85A30';
  }
  if(el('gleft')&&d)el('gleft').textContent=`${s.current}${s.unit} / ${s.total}${s.unit}`;
  if(el('gright')&&d){
    const abs=Math.abs(d.diff);
    el('gright').textContent=d.diff>5?`+${d.diff}${s.unit} 先行`:d.diff<-5?`${abs}${s.unit} 遅れ`:'ほぼ順調';
    el('gright').style.color=d.diff<-5?'#993C1D':d.diff>5?'#3B6D11':'#185FA5';
  }
  // inputs area
  const{date:endStr,days:endDays}=computeEnd(s);
  const endD=new Date(endStr);
  if(el('enddisp'))el('enddisp').innerHTML=`<span class="end-date">${endD.getFullYear()}/${endD.getMonth()+1}/${endD.getDate()}</span><span class="end-days">(${endDays}日間)</span>`;
  PACES.forEach(p=>{const btn=document.getElementById(`pb_${p.key}_${key}`);if(btn)btn.className=`pb${s.pace===p.key?' '+p.cls:''}`;});
}

function toggleInputs(key){
  const inp=document.getElementById(`inp_${key}`);
  const btn=document.getElementById(`ebtn_${key}`);
  const open=inp.classList.toggle('open');
  btn.classList.toggle('open',open);
  btn.textContent=open?'✕':'✎';
}

function buildCard(pg,idx){
  const s=pages[pg][idx],key=`${pg}_${idx}`;
  const d=calcData(s),st=getStatus(d);
  const pct=d?Math.min(100,Math.max(0,d.pct)):0;
  const{date:endStr,days:endDays}=computeEnd(s);
  const endD=new Date(endStr);
  const subjects=Object.keys(MASTER);
  const books=s.subject&&MASTER[s.subject]?Object.keys(MASTER[s.subject]):[];
  const subjOpts=subjects.map(sub=>`<option value="${sub}"${s.subject===sub?' selected':''}>${sub}</option>`).join('');
  const bookOpts=books.map(b=>`<option value="${b}"${s.bookName===b?' selected':''}>${b}</option>`).join('');
  const paceBtns=PACES.map(p=>`<button id="pb_${p.key}_${key}" class="pb${s.pace===p.key?' '+p.cls:''}" onclick="setPace(${pg},${idx},'${p.key}')">${p.label}</button>`).join('');
  const bc=mkBarColors(d),bb=mkBarBorders(d);
  const fillColor=d&&d.diff>=0?'#378ADD':'#D85A30';

  const card=document.createElement('div');
  card.className='card';
  card.innerHTML=`
<div class="card-top">
  <div class="card-meta">
    <div class="card-left">
      <span class="card-num">${pg*6+idx+1}</span>
      <span class="stat-name" id="sname_${key}">${s.bookName||(s.subject?s.subject:`参考書 ${idx+1}`)}</span>
    </div>
    <div class="card-right">
      <span class="badge ${st.cls}" id="badge_${key}">${st.label}</span>
      <button class="edit-btn" id="ebtn_${key}" onclick="toggleInputs('${key}')" title="入力欄を開く">✎</button>
    </div>
  </div>
  <div class="gap-bar-wrap">
    <div class="gap-label">
      <span id="gleft_${key}" style="color:#aaa;font-size:8px">${s.current}${s.unit} / ${s.total}${s.unit}</span>
      <span id="gright_${key}" class="diff-label" style="font-size:8px"></span>
    </div>
    <div class="gap-track"><div class="gap-fill" id="gfill_${key}" style="width:${pct}%;background:${fillColor}"></div></div>
  </div>
  <div class="chart-wrap"><canvas id="cv_${key}" role="img" aria-label="参考書${pg*6+idx+1}の進捗グラフ">進捗グラフ</canvas></div>
  <div class="legend">
    <span><span class="lline"></span>理想ペース</span>
    <span><span class="lsq" style="background:rgba(55,138,221,0.72)"></span>順調</span>
    <span><span class="lsq" style="background:rgba(216,90,48,0.72)"></span>遅れ</span>
  </div>
</div>
<div class="card-inputs" id="inp_${key}">
  <div class="inputs-grid">
    <div class="ig"><label>科目</label><select id="subj_${key}"><option value="">-- 科目 --</option>${subjOpts}</select></div>
    <div class="ig"><label>参考書名</label><select id="book_${key}"><option value="">-- 参考書 --</option>${bookOpts}</select></div>
    <div class="ig"><label>総数</label><input type="number" id="tot_${key}" value="${s.total}" min="1"></div>
    <div class="ig"><label>進捗 (${s.unit})</label><input type="number" id="cur_${key}" value="${s.current}" min="0"></div>
    <div class="ig"><label>開始日</label><input type="date" id="st_${key}" value="${s.start}"></div>
    <div class="ig"><label>終了日 <span style="font-size:8px;color:#bbb">自動</span></label>
      <div class="end-display" id="enddisp_${key}">
        <span class="end-date">${endD.getFullYear()}/${endD.getMonth()+1}/${endD.getDate()}</span>
        <span class="end-days">(${endDays}日間)</span>
      </div>
    </div>
    <div class="ig pace-row">
      <span class="pace-label">ペース</span>
      <div class="pace-btns">${paceBtns}</div>
    </div>
  </div>
</div>`;

  document.getElementById('bookGrid').appendChild(card);

  // Events
  document.getElementById(`subj_${key}`).addEventListener('change',e=>{
    pages[pg][idx].subject=e.target.value;pages[pg][idx].bookName='';
    const bsel=document.getElementById(`book_${key}`);
    const nb=e.target.value&&MASTER[e.target.value]?Object.keys(MASTER[e.target.value]):[];
    bsel.innerHTML=`<option value="">-- 参考書 --</option>`+nb.map(b=>`<option value="${b}">${b}</option>`).join('');
    updateCard(pg,idx);
  });
  document.getElementById(`book_${key}`).addEventListener('change',e=>{
    const bn=e.target.value,subj=pages[pg][idx].subject;
    pages[pg][idx].bookName=bn;
    if(bn&&MASTER[subj]&&MASTER[subj][bn]){
      const m=MASTER[subj][bn];
      pages[pg][idx].total=m.total;pages[pg][idx].unit=m.unit||'p';pages[pg][idx].baseDays=m.days;
      document.getElementById(`tot_${key}`).value=m.total;
    }
    updateCard(pg,idx);
  });
  document.getElementById(`st_${key}`).addEventListener('input',e=>{pages[pg][idx].start=e.target.value;updateCard(pg,idx);});
  [['tot','total',v=>parseInt(v)||1],['cur','current',v=>parseInt(v)||0]].forEach(([fid,prop,parse])=>{
    document.getElementById(`${fid}_${key}`).addEventListener('input',e=>{pages[pg][idx][prop]=parse(e.target.value);updateCard(pg,idx);});
  });

  // Chart
  chartMap[key]=new Chart(document.getElementById(`cv_${key}`),{
    type:'bar',
    data:{
      labels:d?d.labels:[],
      datasets:[
        {type:'bar',label:'実績',data:d?d.actualData:[],backgroundColor:bc,borderColor:bb,borderWidth:1,borderRadius:2,order:2},
        {type:'line',label:'理想ペース',data:d?d.idealData:[],borderColor:'#378ADD',borderWidth:1.5,pointRadius:2,pointBackgroundColor:'#378ADD',pointBorderColor:'#fff',pointBorderWidth:1,tension:0.3,fill:false,order:1}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,animation:false,
      plugins:{
        legend:{display:false},
        tooltip:{mode:'index',intersect:false,callbacks:{label:c=>{
          if(c.dataset.label==='理想ペース')return `理想: ${c.parsed.y}${s.unit}`;
          if(c.parsed.y===null)return null;
          const diff=c.parsed.y-c.chart.data.datasets[1].data[c.dataIndex];
          return `実績: ${c.parsed.y}${s.unit}　(${diff>=0?'+':''}${diff}${s.unit})`;
        }}}
      },
      scales:{
        x:{ticks:{font:{size:8},maxRotation:0,color:'#bbb'},grid:{display:false},border:{display:false}},
        y:{min:0,max:s.total||1,ticks:{font:{size:8},maxTicksLimit:4,color:'#bbb'},grid:{color:'rgba(0,0,0,0.04)'},border:{display:false}}
      }
    }
  });
}

function setPace(pg,idx,paceKey){pages[pg][idx].pace=paceKey;updateCard(pg,idx);}

function renderPage(){
  document.getElementById('bookGrid').innerHTML='';
  const pg=currentPage;
  pages[pg].forEach((_,idx)=>buildCard(pg,idx));
  document.getElementById('pageLabel').textContent=`${pg+1} / ${pages.length}`;
  document.getElementById('prevBtn').disabled=pg===0;
  document.getElementById('nextBtn').disabled=pg===pages.length-1;
}
function changePage(dir){currentPage=Math.max(0,Math.min(pages.length-1,currentPage+dir));renderPage();}
function addPage(){pages.push(Array.from({length:6},emptySlot));currentPage=pages.length-1;renderPage();}

renderPage();
</script>
</body>
</html>
